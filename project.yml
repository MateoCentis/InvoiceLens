# Source of truth for the Xcode project. Regenerate with: xcodegen generate
name: InvoiceLens
options:
  bundleIdPrefix: dev.mateo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # Same default as a new Xcode 26 app: code runs on the main actor unless marked otherwise.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  InvoiceLens:
    type: application
    platform: iOS
    sources: [InvoiceLens]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mateo.InvoiceLens
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: InvoiceLens
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: InvoiceLens uses the camera to scan paper invoices.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [InvoiceLensTests]

  InvoiceLensTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InvoiceLensTests]
    dependencies:
      - target: InvoiceLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
